<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title description">
  <title id="title">Resource-sizing outcomes</title>
  <desc id="description">Illustrative examples on identical scales from zero to 100 units. Over-provisioning: recommended 90, actual 60, waste 30, no violation. Under-provisioning: recommended 60, actual 90, shortfall 30, violation occurs.</desc>
  <rect width="960" height="620" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172536">
    <text x="40" y="38" font-size="24" font-weight="700">Resource-sizing outcomes</text>
    <text x="40" y="66" font-size="16" fill="#526171">Illustrative examples · identical scale in both panels</text>
    <rect x="40" y="88" width="880" height="234" rx="8" fill="#f8fafc" stroke="#cbd5df"/>
    <rect x="40" y="340" width="880" height="234" rx="8" fill="#f8fafc" stroke="#cbd5df"/>
    <text x="60" y="120" font-size="20" font-weight="700">Over-provisioning</text>
    <text x="895" y="120" text-anchor="end" font-size="16" font-weight="700">No violation</text>
    <text x="210" y="166" text-anchor="end" font-size="16">Recommended</text>
    <text x="210" y="211" text-anchor="end" font-size="16">Actual usage</text>
    <rect x="230" y="145" width="540" height="30" rx="3" fill="#356a9a"/>
    <rect x="230" y="190" width="360" height="30" rx="3" fill="#267c70"/>
    <text x="782" y="166" font-size="16" font-weight="700">90 units</text>
    <text x="602" y="211" font-size="16" font-weight="700">60 units</text>
    <path d="M590 231 V241 H770 V231" fill="none" stroke="#526171" stroke-width="2"/>
    <text x="680" y="265" text-anchor="middle" font-size="16" font-weight="700">Waste: 30 units</text>
    <text x="60" y="372" font-size="20" font-weight="700">Under-provisioning</text>
    <text x="895" y="372" text-anchor="end" font-size="16" font-weight="700">Violation occurs</text>
    <text x="210" y="418" text-anchor="end" font-size="16">Recommended</text>
    <text x="210" y="463" text-anchor="end" font-size="16">Actual usage</text>
    <rect x="230" y="397" width="360" height="30" rx="3" fill="#356a9a"/>
    <rect x="230" y="442" width="540" height="30" rx="3" fill="#267c70"/>
    <text x="602" y="418" font-size="16" font-weight="700">60 units</text>
    <text x="782" y="463" font-size="16" font-weight="700">90 units</text>
    <path d="M590 483 V493 H770 V483" fill="none" stroke="#526171" stroke-width="2"/>
    <text x="680" y="517" text-anchor="middle" font-size="16" font-weight="700">Shortfall: 30 units</text>
    <g stroke="#94a3b3" fill="none">
      <path d="M230 282 H830 M230 282 V288 M410 282 V288 M590 282 V288 M770 282 V288 M830 282 V288"/>
      <path d="M230 534 H830 M230 534 V540 M410 534 V540 M590 534 V540 M770 534 V540 M830 534 V540"/>
    </g>
    <g font-size="14" fill="#526171" text-anchor="middle">
      <text x="230" y="307">0</text><text x="410" y="307">30</text><text x="590" y="307">60</text><text x="770" y="307">90</text><text x="830" y="307">100</text>
      <text x="230" y="559">0</text><text x="410" y="559">30</text><text x="590" y="559">60</text><text x="770" y="559">90</text><text x="830" y="559">100</text>
    </g>
    <text x="530" y="603" text-anchor="middle" font-size="16" fill="#526171">Resource units (illustrative)</text>
  </g>
</svg>
